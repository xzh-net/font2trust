# 许可证与风险规则（对应 docs/实施方案.md §7 五档条件表 + §15 管理方案）
#
# 规则执行逻辑在 scripts/analyze_risks.py（证据 → 许可证状态 → 风险等级 → 审核状态）。
# 本文件维护：词库、许可证分类清单、五档条件映射（供引擎与单测读取）。

# ---------------------------------------------------------------------------
# 商业/需授权字体关键词（按 | 分隔，不区分大小写，匹配字体名与许可证文本）
# 命中且无授权依据 -> 高危; 命中且有授权依据 -> 中危
# 词库仅作「商业字体名称线索」，不参与侵权判定，报告中透明展示条数与命中。
# ---------------------------------------------------------------------------
commercial_keywords: >-
  方正|汉仪|华文|文鼎|微软雅黑|黑体|宋体|仿宋|楷体|思源黑体商用|
  Adobe|Helvetica|Arial|Times New Roman|Courier|Gill Sans|DIN|Futura|
  Gotham|Avenir|Frutiger|Optima|Palatino|Bookman|Impact|Chalet|Univers

# ---------------------------------------------------------------------------
# 许可证分类（SPDX；引擎据此判定"已识别/证据待补/存在冲突/已核实"）
# ---------------------------------------------------------------------------
open_spdx:            # 宽松开源 -> 具备"已确认允许"的许可证前提(仍需白名单签署)
  - OFL-1.1
  - Apache-2.0
  - MIT
  - UFL-1.0
  - BSD-3-Clause

restrict_spdx:        # 限制性 -> 中危·待评估(结合分发方式, 不凭名称判违规)
  - GPL
  - AGPL
  - LGPL
  - CC-NC

# ---------------------------------------------------------------------------
# 五档条件表(授权结论产生逻辑, 引擎强制):
#   1 许可证字段为空(来源可推导)      -> 授权待确认 / 中危
#   2 fsType=0                        -> 信息, 不作版权风险证据
#   3 fsType=4|0x0002 嵌入限制        -> 中危·待评估(条件性技术标注)
#   4 明确许可证及授权来源             -> 低危(证据待补, 识别 != 核实)
#   5 来源不明且无法提供授权依据        -> 高危
#   已确认允许: 仅由 whitelist.yaml 中 status=active 条目产生(人工签署)
#   已确认不允许: 仅由人工判定产生, 扫描器不自动输出
# ---------------------------------------------------------------------------
