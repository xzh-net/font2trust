# 全局扫描配置
# 说明: 敏感信息(GitLab token / SMTP 密码)一律通过环境变量注入, 此处只写环境变量名

general:
  workspace: workspace            # 仓库本地缓存目录(相对项目根)
  reports_dir: reports            # 报告输出目录
  evidence_dir: font-compliance   # 字体证据目录(相对项目根; 测试/隔离运行可改指临时区)
  log_level: INFO                 # DEBUG / INFO / WARNING / ERROR
  scan_dependencies: false        # 是否扫描 node_modules 等依赖目录(噪音大, 默认关闭)
  repo_concurrency: 2             # 仓库级并发(P1c): 2=本机 8C16T 实测可用;
                                  #   注意 ScanCode 每仓 processes 个进程,
                                  #   内存紧张或 OOM 时改回 1

# 需要扫描的字体文件扩展名
font_extensions:
  - .ttf
  - .otf
  - .ttc
  - .woff
  - .woff2
  - .eot

# 目录排除规则(依赖目录 scan_dependencies=false 时额外生效)
# 注意: 默认只排 node_modules/vendor —— **不排 dist/build**:
#   第三方框架的 dist(如 adminlte/dist、wxcomponents/vant/dist)内含字体引用与
#   许可证线索, 属合规检测对象; 若项目自有构建产物需跳过, 请在此处显式追加。
# unpackage = uni-app 构建缓存(纯生成物, 内容是 static/ 的副本) —— 实测
#   慧丰收web 1391 文件中 981(71%) 为 unpackage+dist, 其中 unpackage 442 个
#   全是产物副本; 排除后该仓 ScanCode 167s -> 114s, 不损失任何合规证据。
exclude_dirs:
  - .git
  - .svn
  - __pycache__
  - .venv
  - venv
  - .idea
  - .vscode
  - unpackage
exclude_dirs_when_deps_off:
  - node_modules
  - vendor

# 仓库同步(gitlab 信息后续提供, 当前占位)
git:
  enabled: true
  timeout: 600                    # 单仓库同步超时(秒)
  # GITLAB_TOKEN 环境变量名, 用于 private 仓库与 API 自动发现
  token_env: GITLAB_TOKEN

# ScanCode Toolkit 许可证扫描(可选组件: 未安装则自动跳过)
scancode:
  enabled: true
  executable: scancode            # 可执行文件名或绝对路径, 也可用环境变量 SCANCODE_PATH
  processes: 4
  timeout: 1800                   # 单仓库扫描超时(秒)
  min_score: 0                    # 许可证匹配置信度 0-100

# 历史记录（2026-11-09 决策: 撤销 sqlite, 改为文件级归档, 见 §6.3）
history:
  keep_runs: 52                          # 保留最近 N 次扫描记录(约一年)

# 报告
report:
  title: 代码字体版权合规检测报告
  show_disclaimer: true           # 报告页脚展示"非侵权结论"免责声明
